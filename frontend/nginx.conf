server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;   # backend caps uploads at 20 MB

    # Angular SPA — fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API — proxy to the backend container (see docker-compose service name)
    location ~ ^/(auth|report|reviews|me|patient|patients|admin|health)(/|$) {
        proxy_pass http://backend:8000;
        # An upload runs OCR, NER and several model calls (with rate-limit backoff) inside one
        # request. nginx's 60s default cut it off with a 504 while the backend kept working.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so a client cannot spoof its IP by sending its own header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket — live agent activity stream
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
