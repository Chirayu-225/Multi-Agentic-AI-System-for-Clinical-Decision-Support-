# Install once:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-ll", "-r", "backend/src", "backend/main.py"]
        pass_filenames: false
  - repo: local
    hooks:
      - id: no-databases-or-reports
        name: block databases and sample reports (may contain patient data)
        entry: "Refusing to commit a database or PDF - these can hold patient data. Keep it local (see .gitignore)."
        language: fail
        files: '\.(db|db-journal|sqlite3?|pdf)$'
