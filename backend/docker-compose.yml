version: "3.9"

services:

  db:
    image: postgres:16-alpine
    container_name: medsight-db
    environment:
      POSTGRES_DB: medsight
      POSTGRES_USER: medsight
      POSTGRES_PASSWORD: medsight
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medsight"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: medsight-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DATABASE_URL=postgresql://medsight:medsight@db:5432/medsight
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - CORS_ORIGINS=http://localhost:4200,http://localhost:80
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: medsight-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
